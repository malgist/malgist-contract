name: Validate documentation location

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

jobs:
  docs-location:
    name: Docs location check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs location check
        run: bash scripts/check_docs_location.sh
